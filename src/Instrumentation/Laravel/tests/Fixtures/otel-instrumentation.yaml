file_format: '1.0-rc.2'

propagator:
  composite:
    - tracecontext:
    - baggage:

logger_provider:
  processors:
    - simple:
        exporter:
          test/in_memory_exporter: {}

tracer_provider:
  processors:
    - simple:
        exporter:
         test/in_memory_exporter: {}

instrumentation/development:
  php:
    laravel:
      enabled: true

    http:
      uri_sanitizers:
        - default:
        - redact_query_string_values:
            query_keys: [ passwd, secret ]
