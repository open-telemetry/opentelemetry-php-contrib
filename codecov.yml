codecov:
  require_ci_to_pass: false

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project: true
    patch: false

# Pull requests and pushes to main upload coverage only for the projects
# they change, so each flag keeps its last upload until the next one.
flag_management:
  default_rules:
    carryforward: true

parsers:
  gcov:
    branch_detection:
      conditional: true
      loop: true
      method: false
      macro: false

comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: false
