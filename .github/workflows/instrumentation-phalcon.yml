name: "[CI] Phalcon"

on:
  push:
    branches: [main]
    paths:
      - 'src/Instrumentation/Phalcon/**'

  pull_request:
    paths:
      - 'src/Instrumentation/Phalcon/**'

  # To call from https://github.com/opentelemetry-php/contrib-auto-phalcon repo/forks.
  workflow_call:
    inputs:
      package-root:
        type: string
        required: true

permissions:
  contents: read

jobs:
  CI:
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - 8.2
          - 8.3
          - 8.4

    uses: ./.github/workflows/php-contrib.yml
    with:
      job-name: "PHP ${{ matrix.php-version }}"
      codecov-flags: 'Instrumentation/Phalcon'
      package-root: ${{ inputs.package-root || 'src/Instrumentation/Phalcon' }}
      php-version: ${{ matrix.php-version }}
      extensions: 'ast, amqp, grpc, opentelemetry, rdkafka, mysqli, pgsql, phalcon5'
