name: PHP QA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '17 4 * * 1' # weekly, runs every project against new dependency releases
  workflow_dispatch:

permissions:
  contents: read

# Pull requests and pushes to main run only the projects they change, so
# a cancelled main run would leave its projects untested until the
# weekly run. Only pull requests share a group and cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.matrix.outputs.projects }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 2

    - name: Validate root composer.json
      run: composer validate

    # Tests matrix.sh on fixture repositories, before trusting it to
    # build this run's matrix. See .github/ci/README.md.
    - name: Test matrix script
      run: bash .github/ci/matrix_test.sh

    - name: Build matrix
      id: matrix
      env:
        EVENT: ${{ github.event_name }}
        BEFORE: ${{ github.event.before }}
      run: |
        # A pull_request checkout is the merge commit, whose first parent
        # is the base branch. A push to main is normally one squash
        # merge, so before is HEAD^1. Anything else runs every project.
        if [ "$EVENT" = pull_request ]; then
          git diff --name-only HEAD^1 HEAD | bash .github/ci/matrix.sh > matrix.json
        elif [ "$EVENT" = push ] && [ "$BEFORE" = "$(git rev-parse HEAD^1)" ]; then
          git diff --name-only "$BEFORE" HEAD | bash .github/ci/matrix.sh > matrix.json
        else
          bash .github/ci/matrix.sh --all < /dev/null > matrix.json
        fi
        {
          echo "$(jq length matrix.json) projects, $(jq '[.[].cells | length] | add // 0' matrix.json) cells"
          echo
          echo '| Project | Cells | Extensions |'
          echo '|---|---|---|'
          jq -r '.[] | "| \(.project) | \(.cells | map(.name + if .experimental then " (experimental)" else "" end) | join("<br>")) | \(.cells | map(.extensions) | unique | join("<br>")) |"' matrix.json
        } >> "$GITHUB_STEP_SUMMARY"
        echo "projects=$(cat matrix.json)" >> "$GITHUB_OUTPUT"

  php:
    name: ${{ matrix.project }}
    needs: detect
    if: needs.detect.outputs.projects != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.projects) }}
    uses: ./.github/workflows/php-project.yml
    with:
      project: ${{ matrix.project }}
      cells: ${{ toJson(matrix.cells) }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
